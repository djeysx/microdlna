name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (dev)
        run: |
          ./configure.sh
          make

      - name: Build (release)
        run: |
          make clean
          make BUILD=release

      - name: Unit tests
        run: |
          make clean
          ./configure.sh
          make check

  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Functional tests
        run: |
          ./configure.sh
          make check-functional

  functional-tests-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # recent runner kernels use more mmap randomisation bits than
      # ThreadSanitizer supports, making it abort at startup
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Functional tests (ThreadSanitizer)
        run: |
          ./configure.sh
          make check-functional-tsan
